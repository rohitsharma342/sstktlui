name: sstktlui
description: A mobile app for art lovers and collectors to purchase oil paintings.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.6.2
  carousel_slider: ^4.2.1
  badges: ^3.1.2
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true